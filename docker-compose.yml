
services:
  db:
    image: postgres:latest
    container_name:  chess_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_bd:/var/lib/postgresql
  
volumes:
  db_bd: